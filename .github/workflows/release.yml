name: Release on Main Merge
run-name: Create Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get version from package.json
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with autogenerated notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = "v${{ steps.get_version.outputs.version }}"
            try {
              // Check if release already exists
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              })
              core.info(`Release ${version} already exists, skipping.`)
            } catch (e) {
              // If not, create a new release with auto-generated notes
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: version,
                name: `Release ${version}`,
                generate_release_notes: true,
                target_commitish: "main",
              })
              core.info(`Release ${version} created successfully.`)
            }

  build-and-push:
    needs: release
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

      - name: Add container info to release
        run: |
          gh release view "v${{ needs.release.outputs.version }}" --json body -q .body > release_notes.txt
          
          cat >> release_notes.txt <<EOF
          
          ## 🐳 Docker Images
          
          Pull the image:
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
          \`\`\`
          
          Or use latest:
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:latest
          \`\`\`
          
          Run the container:
          \`\`\`bash
          docker run -p 3000:3000 -e TRAEFIK_API_URL=http://your-traefik:8080 ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
          \`\`\`
          EOF
          
          gh release edit "v${{ needs.release.outputs.version }}" -F release_notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
