name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  copilot-review:
    name: GitHub Copilot Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run GitHub Copilot Review
        uses: github/copilot-review@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Post review summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            
            const copilotReview = reviews.find(r => r.user.login === 'github-actions[bot]');
            
            if (copilotReview) {
              core.info('✅ Copilot review completed');
            } else {
              core.setFailed('❌ Copilot review not found');
            }

  lint-and-build:
    name: Lint and Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint
        continue-on-error: true

      - name: Build application
        run: yarn build

      - name: Build summary
        run: |
          echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "Build is ready for deployment" >> $GITHUB_STEP_SUMMARY
